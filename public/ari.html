<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#e8e1ff"><title>Ari · Private space</title><link rel="stylesheet" href="/ari.css?v=voice1"><script defer src="/ari.js?v=voice1"></script><script defer src="/ari-voice-client.js?v=1"></script></head>
<body data-state="idle"><header><span class="wordmark"><span class="brand-spark" aria-hidden="true">✦</span> ARI <small>YOUR PRIVATE SPACE</small></span><nav aria-label="Conversation controls"><button id="new-chat" hidden title="New conversation" aria-label="New conversation">＋</button><button id="logout" hidden title="Sign out" aria-label="Sign out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5m5-12 4 4-4 4m-6-4h10"/></svg></button></nav></header>
<main><section class="presence" aria-label="Ari"><div class="orb-wrap"><span class="orbit orbit-one"></span><span class="orbit orbit-two"></span><button id="orb" aria-label="Start voice conversation" aria-expanded="false"><span class="orb-body"><span class="orb-current"></span><span class="orb-cloud"></span><span class="orb-light"></span><span class="orb-shine"></span></span></button><span class="orb-shadow"></span></div><h1 id="greeting">A little space to think.</h1><p id="presence-label">Just you and Ari.</p></section>
<div class="voice-controls"><p id="voice-hint" hidden>Tap the orb to talk</p><p id="voice-caption" aria-live="polite"></p><button id="voice-end" hidden>End voice</button></div><section id="access" class="access" aria-label="Private sign-in"><div id="google-button"></div><p id="access-message" role="status">Preparing your private space…</p><button id="access-retry" hidden>Try again</button></section>
<button id="open-chat" class="open-chat" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v11H9l-4 4Z"/></svg> Open text chat</button>
<section id="conversation" class="conversation" aria-label="Conversation" hidden><div class="conversation-top"><span>CONVERSATION</span><button id="hide-chat" aria-label="Hide conversation">Minimise <span aria-hidden="true">−</span></button></div><div id="messages" class="messages" role="log" aria-label="Messages" aria-live="off"></div><form id="composer"><label class="sr-only" for="prompt">Message Ari</label><textarea id="prompt" rows="1" maxlength="16000" placeholder="What’s on your mind?"></textarea><button id="send" type="submit" aria-label="Send message"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button><button id="stop" type="button" aria-label="Stop response" hidden>■</button></form><p class="conversation-note">This conversation stays in this browser tab. Messages and voice go to DeepSeek; spoken replies use Kokoro.</p></section>
</main><footer><span class="status-dot" aria-hidden="true"></span><span id="status" role="status" aria-live="polite">Private by design.</span></footer></body></html>
